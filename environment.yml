name: torch_geometric

channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge

dependencies:
  - python=3.10.13

  - pytorch=2.1.0
  - pytorch-cuda=12.1
  - pyg=2.4.0

  - rdkit=2022.03.2

  - numpy=1.26.0
  - pandas=1.5.3
  - scipy=1.11.3
  - scikit-learn=1.3.0
  - matplotlib-base=3.4.3

  - mlflow=3.1.0

  - joblib=1.2.0
  - tqdm=4.65.0
  - openpyxl=3.1.2
  - pyyaml=6.0.1
  - pip=23.3
  - setuptools=68.0.0
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - pyg-lib==0.3.0+pt21cu121
      - torch-scatter==2.1.2+pt21cu121
      - torch-sparse==0.6.18+pt21cu121
      - torch-cluster==1.6.3+pt21cu121
      - torch-spline-conv==1.2.2+pt21cu121

      - pytorch-lightning==2.1.0
      - torchmetrics==1.2.0
      - tensorboard==2.15.2
      - optuna==4.8.0
      - dgl==1.1.2
      - dgllife==0.3.2